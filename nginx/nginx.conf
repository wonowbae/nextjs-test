# Windows Nginx reverse proxy for a closed network.
# Replace the installation paths and ports to suit your host.
worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 5g;

        # Global whitelist (exactly seven client IPs).
        allow 8.48.131.181;
        allow 8.48.131.182;
        allow 8.48.131.183;
        allow 8.48.131.184;
        allow 8.48.131.185;
        allow 8.48.131.186;
        allow 8.48.131.187;
        deny all;

        # Flask file-sharing web UI at /files/.
        location = /files {
            return 301 /files/;
        }

        location /files/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /files;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Existing Prisma mirror directory:
        # C:/infra/prisma/all_commits/<engine-commit>/windows/<filename>
        location /prisma/ {
            alias C:/infra/prisma/;
            autoindex off;
        }

        # Backward-compatible Gitea: public :8080 remains in use.
        # Existing Gitea ROOT_URL can remain http://SERVER_IP:8080/.
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
